function addCustomSectionFromForm() {
  syncAddedSectionsFromEditor();
  const title = cleanText($('customNewSectionTitle')?.value) || 'قسم جديد';
  const type = ($('customNewSectionType')?.value === 'photo' ? 'attachment' : (['text','attachment','photo','date','number'].includes($('customNewSectionType')?.value) ? $('customNewSectionType').value : 'text'));

function removeCustomSectionDraft(id) {

function applyFullSectionOrder(config) {
  const reportForm = $('reportForm');
  if (!reportForm) return;
  const order = getFullSectionOrder(config);
  const cards = {};
  qsa('#reportForm &gt; section.card').forEach(card =&gt; {
    if (card.classList.contains('custom-added-section')) cards[`custom:${card.dataset.customAddedId || ''}`] = card;
    else if (card.dataset.sectionKey) cards[card.dataset.sectionKey] = card;
  });
  order.forEach(key =&gt; {
    if (cards[key]) reportForm.appendChild(cards[key]);
  });
  qsa('#reportForm &gt; section.card').forEach(card =&gt; {
    const key = card.classList.contains('custom-added-section') ? `custom:${card.dataset.customAddedId || ''}` : card.dataset.sectionKey;
    if (!order.includes(key)) reportForm.appendChild(card);
  });

function renderCustomAddedSections(sections = []) {

    card.className = 'card custom-added-section';

    card.innerHTML = `
      &lt;div class=&quot;card-header&quot;&gt;&lt;h3&gt;${escapeHtml(section.title || 'قسم جديد')}&lt;/h3&gt;&lt;/div&gt;

        ${customSectionInputHtml(section, index)}
      &lt;/div&gt;`;
    reportForm.appendChild(card);

function applySectionManagerCustomization(config) {

  renderCustomAddedSections(config?.customSections?.added || []);

  CORE_SECTION_MANAGER.forEach(item =&gt; {
    const card = document.querySelector(`[data-section-key=&quot;${CSS.escape(item.key)}&quot;]`);

  });
}

function collectCustomizationFormData() {
  const fields = {};
  REPORT_FIELD_CONFIG.forEach(field =&gt; {
    fields[field.id] = {
      label: getCurrentLabelForField(field.id, field.defaultLabel),
      placeholder: $(field.id)?.placeholder || field.defaultPlaceholder || '',
      required: $(field.id)?.getAttribute('data-required') === 'true' || !!field.required
    };
  });
  const mainText = {};
  const customSectionsCore = {};
  CORE_SECTION_MANAGER.forEach(item =&gt; {
    const labelInput = document.querySelector(`[data-section-label-key=&quot;${CSS.escape(item.key)}&quot;]`);
    const label = cleanText(labelInput?.value) || item.def;
    const deleted = !!document.querySelector(`[data-section-delete-key=&quot;${CSS.escape(item.key)}&quot;]`)?.checked;
    customSectionsCore[item.key] = { deleted };
    if (item.type === 'reportInfo') setValue('customReportSectionTitle', label);
    else mainText[item.labelKey] = label;
  });
  const added = syncAddedSectionsFromEditor();
  const optionGroups = {};
  Object.entries(OPTION_GROUP_TEXTAREA_MAP).forEach(([group, id]) =&gt; { optionGroups[group] = getLinesFromTextarea(id, DEFAULT_OPTION_GROUPS[group]); });
  let fileName = cleanText($('customHtmlFileName')?.value) || 'نموذج_تقرير_تمرين_الإخلاء_المخصص.html';
  if (!/\.html?$/i.test(fileName)) fileName += '.html';
  return {
    version: 'v40-custom-added-section-move-fixed',
    createdAt: new Date().toISOString(),
    fileName,
    reportInfoTitle: cleanText($('customReportSectionTitle')?.value) || 'معلومات التقرير',
    fields,
    sections: {
      purpose: {
        title: cleanText($('customPurposeTitle')?.value) || 'الوصف العام والغرض من تمرين الإخلاء بالحريق',
        placeholder: String($('customPurposePlaceholder')?.value || ''),
        defaultText: normalizeBulletText($('customPurposeDefault')?.value || '')
      },
      scenario: {
        title: cleanText($('customScenarioTitle')?.value) || 'سيناريو التمرين الافتراضي',
        placeholder: String($('customScenarioPlaceholder')?.value || ''),
        defaultText: normalizeBulletText($('customScenarioDefault')?.value || '')
      }
    },
    mainText,
    optionGroups,
    evaluationPoints: getLinesFromTextarea('customEvaluationPoints', evaluationPoints),
    customSections: {
      core: customSectionsCore,
      order: qsa('.section-manager-row', $('customSectionManagerBody')).map(row =&gt; row.dataset.sectionManagerKey).filter(Boolean),
      added
    }
  };
}

function init() {
  initEvaluationTable();
  setupOtherFields();
  setupBulletTextareaHandlers();
  applySavedCustomizationData();
  $('reportDate').value = todayInputValue();
  addObserver();
  addAction();
  addSignature();
  calculateScore();
  setupAutoResize();
  updateTotalEvacuation();
  restoreBrowserAutoSave();
  applySavedCustomizationData();
  document.addEventListener('input', event =&gt; {
    if (event.target.classList.contains('invalid')) event.target.classList.remove('invalid');
    if (event.target.matches('textarea.auto-expand')) autoResizeTextarea(event.target);
    if (event.target.matches('#evacStarted, #evacEnded')) updateTotalEvacuation();
    queueAutoSave();
  });
  document.addEventListener('change', event =&gt; {
    if (event.target &amp;&amp; event.target.matches('#evacStarted, #evacEnded')) updateTotalEvacuation();
    queueAutoSave();
  });
}

document.addEventListener('DOMContentLoaded', init);
&lt;/script&gt;

<script>
    (function () {
      const select = document.getElementById('languageSelect');
      const frameEn = document.getElementById('frameEn');
      const frameAr = document.getElementById('frameAr');
      function applyLanguage(value) {
        const isArabic = value === 'ar';
        frameEn.classList.toggle('active', !isArabic);
        frameAr.classList.toggle('active', isArabic);
        document.documentElement.lang = isArabic ? 'ar' : 'en';
        document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
      }
      select.addEventListener('change', function () { applyLanguage(this.value); });
      applyLanguage(select.value);
    })();
  </script>
