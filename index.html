      flex-direction: column;
      gap: 2px;
      min-width: 220px;
    }

      color: var(--navy);

      color: var(--gray-700);
      font-size: 12px;
      font-weight: 700;

      flex-wrap: wrap;

      color: var(--navy);
      font-weight: 900;
      font-size: 13px;
    }
    #languageSelect {
      min-height: 40px;
      min-width: 210px;
      padding: 9px 12px;
      border: 1px solid var(--gray-300);
      border-radius: 14px;
      background: var(--white);
      color: var(--navy);
      font-weight: 900;
      outline: none;
    }

      width: min(1240px, calc(100% - 24px));
      height: 100%;
      min-height: 0;
      margin: 0 auto 12px;
      border: 1px solid var(--gray-300);
      border-radius: 18px;
      overflow: hidden;
      background: var(--white);
      box-shadow: 0 16px 34px rgba(16, 30, 54, 0.09);
    }
    iframe.form-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: var(--white);

const REPORT_FIELD_CONFIG = [
  { id: 'propertyName', name: 'Property / Hotel Name', defaultLabel: 'Property / Hotel Name', defaultPlaceholder: 'Example: Conrad Abu Dhabi Etihad Towers', required: true },
  { id: 'reportDate', name: 'Drill Date', defaultLabel: 'Drill Date', defaultPlaceholder: '', required: true },
  { id: 'drillTime', name: 'Drill Period', defaultLabel: 'Drill Period', defaultPlaceholder: '', required: false },
  { id: 'drillType', name: 'Drill Type', defaultLabel: 'Drill Type', defaultPlaceholder: '', required: false },
  { id: 'reportRef', name: 'Report Reference', defaultLabel: 'Report Reference', defaultPlaceholder: 'Optional reference', required: false },
  { id: 'completedBy', name: 'Person Completing Form', defaultLabel: 'Person Completing Form', defaultPlaceholder: 'Name', required: true },
  { id: 'completedTitle', name: 'Title', defaultLabel: 'Title', defaultPlaceholder: 'Title / Position', required: true },
  { id: 'monitorLocation', name: 'Location of Drill Monitor', defaultLabel: 'Location of Drill Monitor', defaultPlaceholder: 'Example: P3 level – luggage room', required: true },
  { id: 'alarmLocation', name: 'Alarm Location', defaultLabel: 'Alarm Location', defaultPlaceholder: 'Alarm location', required: true },
  { id: 'respondTeam', name: 'Name of Respond Team', defaultLabel: 'Name of Respond Team', defaultPlaceholder: 'Respond team name', required: true },
  { id: 'assemblyCondition', name: 'Assembly Point Condition', defaultLabel: 'Assembly Point Condition', defaultPlaceholder: 'Condition / comments', required: true }
];
let activeFormCustomization = null;

function normalizeLabelText(text) {
  return String(text || '').replace(/\s*\*\s*$/g, '').trim();
}
function getCurrentLabelForField(id, fallback) {
  const label = document.querySelector(`label[for=&quot;${CSS.escape(id)}&quot;]`);
  return normalizeLabelText(label ? label.textContent : fallback);
}
function setLabelForField(id, labelText, required) {
  const label = document.querySelector(`label[for=&quot;${CSS.escape(id)}&quot;]`);
  if (!label) return;
  label.textContent = `${labelText || id}${required ? ' *' : ''}`;
}
function sectionTitleFor(key, fallback) {
  return activeFormCustomization?.sections?.[key]?.title || fallback;
}
function labelForField(id, fallback) {
  return activeFormCustomization?.fields?.[id]?.label || getCurrentLabelForField(id, fallback);
}
function getCustomizationPayloadFromScript() {
  const script = $('spxFormCustomizationData');
  if (!script) return null;
  try {
    return JSON.parse(script.textContent || '{}');
  } catch (err) {
    console.warn('Invalid customization data:', err);
    return null;
  }
}
function applyFormCustomization(config, options = {}) {
  if (!config || typeof config !== 'object') return;
  activeFormCustomization = config;
  const reportHeader = document.querySelector('#reportForm .card:first-of-type .card-header h3');
  if (reportHeader &amp;&amp; config.reportInfoTitle) reportHeader.textContent = config.reportInfoTitle;
  REPORT_FIELD_CONFIG.forEach(field =&gt; {
    const custom = config.fields?.[field.id] || {};
    const required = custom.required !== undefined ? !!custom.required : field.required;
    const label = custom.label || field.defaultLabel;
    const input = $(field.id);
    setLabelForField(field.id, label, required);
    if (input) {
      if (custom.placeholder !== undefined &amp;&amp; input.type !== 'date') input.placeholder = custom.placeholder || '';
      if (required) input.setAttribute('data-required', 'true');
      else input.removeAttribute('data-required');
    }
  });
  const purpose = config.sections?.purpose || {};
  const scenario = config.sections?.scenario || {};
  setLabelForField('purposeOfDrill', purpose.title || 'General and Purpose of fire drill exercise', true);
  setLabelForField('mockScenario', scenario.title || 'Mock Drill Scenario', true);
  if ($('purposeOfDrill')) {
    $('purposeOfDrill').placeholder = purpose.placeholder || 'Write the general details and purpose of the fire drill exercise';
    if (options.setDefaults &amp;&amp; purpose.defaultText &amp;&amp; !cleanText($('purposeOfDrill').value)) $('purposeOfDrill').value = normalizeBulletText(purpose.defaultText);
  }
  if ($('mockScenario')) {
    $('mockScenario').placeholder = scenario.placeholder || 'Write the mock drill scenario';
    if (options.setDefaults &amp;&amp; scenario.defaultText &amp;&amp; !cleanText($('mockScenario').value)) $('mockScenario').value = normalizeBulletText(scenario.defaultText);
  }
  setupAutoResize();
}
function applySavedCustomizationData() {
  const config = getCustomizationPayloadFromScript();
  if (config) applyFormCustomization(config, { setDefaults: true });
}
function buildCustomizeFieldRows(config = null) {
  const body = $('customReportFieldsBody');
  if (!body) return;
  body.innerHTML = '';
  REPORT_FIELD_CONFIG.forEach(field =&gt; {
    const custom = config?.fields?.[field.id] || {};
    const required = custom.required !== undefined ? !!custom.required : ($(field.id)?.getAttribute('data-required') === 'true' || field.required);
    const labelValue = custom.label || getCurrentLabelForField(field.id, field.defaultLabel);
    const placeholderValue = custom.placeholder !== undefined ? custom.placeholder : ($(field.id)?.placeholder || field.defaultPlaceholder || '');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      &lt;td&gt;&lt;strong&gt;${escapeHtml(field.name)}&lt;/strong&gt;&lt;/td&gt;
      &lt;td&gt;&lt;input type=&quot;text&quot; data-custom-field=&quot;${field.id}&quot; data-custom-part=&quot;label&quot; value=&quot;${escapeAttr(labelValue)}&quot;&gt;&lt;/td&gt;
      &lt;td&gt;&lt;input type=&quot;text&quot; data-custom-field=&quot;${field.id}&quot; data-custom-part=&quot;placeholder&quot; value=&quot;${escapeAttr(placeholderValue)}&quot; ${field.id === 'reportDate' ? 'disabled' : ''}&gt;&lt;/td&gt;
      &lt;td&gt;&lt;label class=&quot;customize-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-custom-field=&quot;${field.id}&quot; data-custom-part=&quot;required&quot; ${required ? 'checked' : ''}&gt; Required&lt;/label&gt;&lt;/td&gt;`;
    body.appendChild(tr);
  });
}
function openCustomizeForm() {
  const config = activeFormCustomization || getCustomizationPayloadFromScript() || {};
  buildCustomizeFieldRows(config);
  setValue('customReportSectionTitle', config.reportInfoTitle || document.querySelector('#reportForm .card:first-of-type .card-header h3')?.textContent || 'Report Information');
  setValue('customHtmlFileName', config.fileName || 'Customized_Fire_Drill_Report_Form.html');
  setValue('customPurposeTitle', config.sections?.purpose?.title || getCurrentLabelForField('purposeOfDrill', 'General and Purpose of fire drill exercise'));
  setValue('customPurposePlaceholder', config.sections?.purpose?.placeholder || $('purposeOfDrill')?.placeholder || 'Write the general details and purpose of the fire drill exercise');
  setValue('customPurposeDefault', config.sections?.purpose?.defaultText || valueOf('purposeOfDrill'));
  setValue('customScenarioTitle', config.sections?.scenario?.title || getCurrentLabelForField('mockScenario', 'Mock Drill Scenario'));
  setValue('customScenarioPlaceholder', config.sections?.scenario?.placeholder || $('mockScenario')?.placeholder || 'Write the mock drill scenario');
  setValue('customScenarioDefault', config.sections?.scenario?.defaultText || valueOf('mockScenario'));
  $('customizeModal').classList.add('show');
  setupAutoResize($('customizeModal'));
}
function closeCustomizeForm() {
  $('customizeModal').classList.remove('show');
}
function collectCustomizationFormData() {
  const fields = {};
  REPORT_FIELD_CONFIG.forEach(field =&gt; {
    const labelInput = document.querySelector(`[data-custom-field=&quot;${field.id}&quot;][data-custom-part=&quot;label&quot;]`);
    const placeholderInput = document.querySelector(`[data-custom-field=&quot;${field.id}&quot;][data-custom-part=&quot;placeholder&quot;]`);
    const requiredInput = document.querySelector(`[data-custom-field=&quot;${field.id}&quot;][data-custom-part=&quot;required&quot;]`);
    fields[field.id] = {
      label: cleanText(labelInput?.value) || field.defaultLabel,
      placeholder: placeholderInput &amp;&amp; !placeholderInput.disabled ? String(placeholderInput.value || '') : '',
      required: !!requiredInput?.checked
    };
  });
  let fileName = cleanText($('customHtmlFileName')?.value) || 'Customized_Fire_Drill_Report_Form.html';
  if (!/\.html?$/i.test(fileName)) fileName += '.html';
  return {
    version: 'v31-custom-form-builder',
    createdAt: new Date().toISOString(),
    fileName,
    reportInfoTitle: cleanText($('customReportSectionTitle')?.value) || 'Report Information',
    fields,
    sections: {
      purpose: {
        title: cleanText($('customPurposeTitle')?.value) || 'General and Purpose of fire drill exercise',
        placeholder: String($('customPurposePlaceholder')?.value || ''),
        defaultText: normalizeBulletText($('customPurposeDefault')?.value || '')
      },
      scenario: {
        title: cleanText($('customScenarioTitle')?.value) || 'Mock Drill Scenario',
        placeholder: String($('customScenarioPlaceholder')?.value || ''),
        defaultText: normalizeBulletText($('customScenarioDefault')?.value || '')
      }
    }
  };
}

function applySectionOrderToExportClone(clone, config) {
  const form = clone.querySelector('#reportForm');
  if (!form || !config) return;
  const coreKeys = (Array.isArray(CORE_SECTION_MANAGER) ? CORE_SECTION_MANAGER.map(item =&gt; item.key) : []);
  const addedSections = Array.isArray(config?.customSections?.added) ? config.customSections.added : [];
  const addedKeys = addedSections.map(section =&gt; `custom:${section?.id || ''}`).filter(key =&gt; key !== 'custom:');
  let savedOrder = Array.isArray(config?.customSections?.order) ? [...config.customSections.order] : [];
  if (savedOrder.includes('notificationWeather')) {
    savedOrder = savedOrder.flatMap(key =&gt; key === 'notificationWeather' ? ['notification', 'weather', 'activation', 'participants'] : key);
  }
  const allowed = [...coreKeys, ...addedKeys];
  const order = [...new Set([...savedOrder.filter(key =&gt; allowed.includes(key)), ...allowed.filter(key =&gt; !savedOrder.includes(key))])];
  const cards = {};
  clone.querySelectorAll('#reportForm &gt; section.card').forEach(card =&gt; {
    const key = card.classList.contains('custom-added-section') ? `custom:${card.dataset.customAddedId || ''}` : (card.dataset.sectionKey || '');
    if (key) cards[key] = card;
  });
  order.forEach(key =&gt; { if (cards[key]) form.appendChild(cards[key]); });
  const core = config?.customSections?.core || {};
  Object.keys(core).forEach(key =&gt; {
    const card = clone.querySelector(`[data-section-key=&quot;${key}&quot;]`);
    if (card) card.style.display = core[key]?.deleted ? 'none' : '';

}

function prepareCleanHtmlCloneForCustomization(config) {
  const clone = document.documentElement.cloneNode(true);

  // Customized exported HTML is a final working form.
  // Do not export the Customize Form button or the customization modal.
  const customizeButton = clone.querySelector('button[onclick=&quot;openCustomizeForm()&quot;]');
  if (customizeButton) customizeButton.remove();
  const customizeModal = clone.querySelector('#customizeModal');
  if (customizeModal) customizeModal.remove();

  clone.querySelectorAll('.modal-overlay.show, .quick-feedback.show').forEach(el =&gt; el.classList.remove('show'));
  const cloneFeedback = clone.querySelector('#quickFeedback');
  if (cloneFeedback) cloneFeedback.textContent = '';
  ['observerList', 'actionList', 'signatureList', 'photosGrid'].forEach(id =&gt; {
    const el = clone.querySelector(`#${id}`);
    if (el) el.innerHTML = '';
  });
  clone.querySelectorAll('input').forEach(input =&gt; {
    if (['checkbox', 'radio'].includes(input.type)) {
      input.removeAttribute('checked');
    } else if (input.type !== 'file') {
      if (input.id === 'customHtmlFileName') input.setAttribute('value', config.fileName);
      else input.removeAttribute('value');
    }
  });
  clone.querySelectorAll('textarea').forEach(textarea =&gt; {
    textarea.textContent = '';
  });
  clone.querySelectorAll('select option').forEach(option =&gt; option.removeAttribute('selected'));
  clone.querySelectorAll('#customizeModal input, #customizeModal textarea').forEach(el =&gt; {
    if (el.type === 'checkbox') el.removeAttribute('checked');
    else el.removeAttribute('value');
    if (el.tagName === 'TEXTAREA') el.textContent = '';
  });
  applySectionOrderToExportClone(clone, config);
  const oldConfig = clone.querySelector('#spxFormCustomizationData');
  if (oldConfig) oldConfig.remove();
  const script = clone.ownerDocument.createElement('script');
  script.id = 'spxFormCustomizationData';
  script.type = 'application/json';
  script.textContent = JSON.stringify(config, null, 2).replace(/&lt;\/script/gi, '&lt;\/script');
  clone.querySelector('body').appendChild(script);
  let finalHtml = '&lt;!DOCTYPE html&gt;\n' + clone.outerHTML;
  const customKey = `spx_fire_drill_report_auto_save_${Date.now()}`;
  finalHtml = finalHtml.replace(/const AUTO_SAVE_KEY = 'spx_fire_drill_report_auto_save_v22[^']*';/, `const AUTO_SAVE_KEY = '${customKey}';`);
  return finalHtml;
}
function saveCustomizedHtmlForm() {
  const config = collectCustomizationFormData();
  const html = prepareCleanHtmlCloneForCustomization(config);
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = config.fileName;
  document.body.appendChild(a);
  a.click();
  setTimeout(() =&gt; { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  closeCustomizeForm();
  showQuickFeedback('Customized HTML form saved successfully');
}

function calculateTotalEvacuationText(startValue, endValue) {
  const parseMinutes = value =&gt; {
    const match = String(value || '').match(/^(\d{1,2}):(\d{2})/);
    if (!match) return null;
    const hours = Number(match[1]);
    const minutes = Number(match[2]);
    if (!Number.isFinite(hours) || !Number.isFinite(minutes)) return null;
    return hours * 60 + minutes;
  };
  const start = parseMinutes(startValue);
  const end = parseMinutes(endValue);
  if (start === null || end === null) return '';
  let diff = end - start;
  if (diff &lt; 0) diff += 24 * 60;
  const hours = Math.floor(diff / 60);
  const minutes = diff % 60;
  if (hours &amp;&amp; minutes) return `${hours} hr ${minutes} min`;
  if (hours) return `${hours} hr`;
  return `${minutes} min`;
}

}
function parseFlexibleDate(value) {
  const raw = cleanText(value);
  if (!raw) return null;
  let m = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) {
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return Number.isNaN(d.getTime()) ? null : d;
  }
  m = raw.match(/^(\d{1,2})[\/\.\-\s]([A-Za-z]{3,}|\d{1,2})[\/\.\-\s](\d{4})$/);
  if (m) {
    const day = Number(m[1]);
    const monthRaw = String(m[2]).toLowerCase();
    const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const month = /^\d+$/.test(monthRaw) ? Number(monthRaw) - 1 : months.indexOf(monthRaw.slice(0,3));
    const d = new Date(Number(m[3]), month, day);
    return (month &lt; 0 || Number.isNaN(d.getTime())) ? null : d;
  }
  const fallback = new Date(raw);
  return Number.isNaN(fallback.getTime()) ? null : fallback;
}

function capitalizeLineFirstLetter(text) {
  return String(text || '').replace(/^([^A-Za-z]*)([a-z])/, (m, pre, ch) =&gt; pre + ch.toUpperCase());

function normalizeBulletText(value) {
  const raw = String(value || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  if (!raw.trim()) return '';
  return raw
    .split(/\n+/)
    .map(line =&gt; {
      let t = line.trimStart();
      if (!t) return '';
      t = t.replace(/^(?:[-•]\s*)/, '');
      return '- ' + capitalizeLineFirstLetter(t);
    })
    .filter(Boolean)
    .join('\n\n');
}

function normalizeBulletTextareaInPlace(el) {
  if (!el) return;
  const oldValue = el.value;
  const oldPos = el.selectionStart || 0;
  const nextValue = normalizeBulletText(oldValue);
  if (nextValue !== oldValue) {
    const delta = nextValue.length - oldValue.length;
    el.value = nextValue;
    const nextPos = Math.max(0, Math.min(nextValue.length, oldPos + delta));
    try { el.setSelectionRange(nextPos, nextPos); } catch (err) {}
  }
  autoResizeTextarea(el);
}
function setupBulletTextareaHandlers() {
  qsa('textarea.bullet-textarea').forEach(el =&gt; {
    if (el.dataset.bulletReady === 'true') return;
    el.dataset.bulletReady = 'true';
    el.addEventListener('keydown', event =&gt; {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      const start = el.selectionStart || 0;
      const end = el.selectionEnd || start;
      const insertText = (start === 0 &amp;&amp; !el.value.trim()) ? '- ' : '\n\n- ';
      el.value = el.value.slice(0, start) + insertText + el.value.slice(end);
      const nextPos = start + insertText.length;
      el.setSelectionRange(nextPos, nextPos);
      autoResizeTextarea(el);
    });
    el.addEventListener('input', () =&gt; normalizeBulletTextareaInPlace(el));
    el.addEventListener('blur', () =&gt; normalizeBulletTextareaInPlace(el));
  });
}

function getDraftFileName(data) {
  const property = (data.propertyName || 'Fire_Drill_Report').replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '') || 'Fire_Drill_Report';
  return currentDraftFileName || `${property}_Draft.json`;

function saveDraftByDownload(jsonText, fileName) {
  const blob = new Blob([jsonText], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  setTimeout(() =&gt; { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

async function saveDraft() {
  const data = collectFormData();
  data.savedAt = new Date().toISOString();
  const jsonText = JSON.stringify(data, null, 2);
  const fileName = getDraftFileName(data);
  try {
    if ('showSaveFilePicker' in window) {
      if (!draftFileHandle) {
        draftFileHandle = await window.showSaveFilePicker({
          suggestedName: fileName,
          types: [{ description: 'Fire Drill Draft JSON', accept: { 'application/json': ['.json'] } }]
        });
      }
      const writable = await draftFileHandle.createWritable();
      await writable.write(new Blob([jsonText], { type: 'application/json' }));
      await writable.close();
      currentDraftFileName = draftFileHandle.name || fileName;
      showQuickFeedback('Draft saved successfully');
      return;
    }
  } catch (err) {
    if (err &amp;&amp; err.name === 'AbortError') return;
    console.warn('File System Access save failed, using download fallback.', err);
  }
  saveDraftByDownload(jsonText, fileName);
  showQuickFeedback('Draft saved successfully');
}

async function loadDraft() {
  try {
    if ('showOpenFilePicker' in window) {
      const [handle] = await window.showOpenFilePicker({
        multiple: false,
        types: [{ description: 'Fire Drill Draft JSON', accept: { 'application/json': ['.json'] } }]
      });
      if (!handle) return;
      const file = await handle.getFile();
      const text = await file.text();
      const data = JSON.parse(text);
      draftFileHandle = handle;
      currentDraftFileName = file.name || handle.name || '';
      applyFormData(data);
      showModal('Draft Loaded', '&lt;p style=&quot;font-weight:900;margin:0;&quot;&gt;The fire drill report draft has been loaded successfully. Save Draft will update this same JSON file.&lt;/p&gt;');
      return;
    }
  } catch (err) {
    if (err &amp;&amp; err.name === 'AbortError') return;
    showModal('Invalid Draft File', '&lt;p style=&quot;font-weight:900;margin:0;color:#e74c3c;&quot;&gt;The selected file could not be loaded as a valid fire drill draft.&lt;/p&gt;');
    return;
  }
  $('loadDraftFile').click();
}

function loadDraftFromFile(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e =&gt; {
    try {
      const data = JSON.parse(e.target.result);
      draftFileHandle = null;
      currentDraftFileName = file.name || '';
      applyFormData(data);
      showModal('Draft Loaded', '&lt;p style=&quot;font-weight:900;margin:0;&quot;&gt;The fire drill report draft has been loaded successfully.&lt;/p&gt;');
    } catch (err) {
      showModal('Invalid Draft File', '&lt;p style=&quot;font-weight:900;margin:0;color:#e74c3c;&quot;&gt;The selected file could not be loaded as a valid fire drill draft.&lt;/p&gt;');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function queueAutoSave() {
  if (isApplyingData) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() =&gt; {
    try {
      localStorage.setItem(AUTO_SAVE_KEY, JSON.stringify(collectFormData()));
    } catch (err) {
      console.warn('Browser auto-save failed. The draft may be too large for local storage.', err);
    }
  }, 500);
}

function hasMeaningfulDraft(data) {
  if (!data || typeof data !== 'object') return false;
  const fields = ['propertyName', 'reportRef', 'completedBy', 'completedTitle', 'monitorLocation', 'alarmLocation', 'respondTeam', 'assemblyCondition', 'purposeOfDrill', 'mockScenario', 'assemblyCount'];
  return fields.some(key =&gt; cleanText(data[key])) ||
    (data.observers || []).some(item =&gt; cleanText(item.name) || cleanText(item.title)) ||
    (data.actions || []).some(item =&gt; cleanText(item.point) || cleanText(item.responsibility) || cleanText(item.status) || cleanText(item.targetDate) || cleanText(item.completionDate)) ||
    (data.signatures || []).some(item =&gt; cleanText(item.name) || cleanText(item.title) || cleanText(item.signature) || cleanText(item.date)) ||
    (data.attachments || []).length &gt; 0 ||
    (data.customAddedSections || []).some(item =&gt; cleanText(item.value)) ||
    (data.evaluation?.rows || []).some(row =&gt; row.mark !== null &amp;&amp; row.mark !== undefined);
}

function restoreBrowserAutoSave() {
  try {
    const raw = localStorage.getItem(AUTO_SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!hasMeaningfulDraft(data)) return false;
    applyFormData(data);
    return true;
  } catch (err) {
    console.warn('Browser auto-save restore failed.', err);
    return false;
  }
}

function normalizePdfText(text) {
  return String(text || '')
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n')
    .replace(/[“”]/g, '&quot;')
    .replace(/[‘’]/g, &quot;'&quot;)
    .replace(/[–—]/g, '-')
    .replace(/•/g, '-')
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001f]/g, ' ')
    .replace(/[ \t]+/g, ' ')
    .replace(/\n[ \t]+/g, '\n')
    .trim();
}
function hasArabicText(text) { return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/.test(String(text || '')); }
function isMostlyArabicText(text) {
  const safe = String(text || '');
  const arabic = (safe.match(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/g) || []).length;
  const latin = (safe.match(/[A-Za-z0-9]/g) || []).length;
  return arabic &gt; latin;
}
function shouldRenderTextAsMask(text) { return /[^\x09\x0A\x0D\x20-\x7E]/.test(String(text || '')); }
function pdfEscape(text) { return normalizePdfText(text).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
function getCanvasFont(size = 10, bold = false) {
  return `${bold ? '700' : '400'} ${Math.max(1, size)}px Arial, Tahoma, &quot;Noto Naskh Arabic&quot;, &quot;Segoe UI&quot;, sans-serif`;
}
const measureCanvas = (typeof document !== 'undefined') ? document.createElement('canvas') : null;
function measurePdfTextWidth(text, size = 10, bold = false) {
  const safe = normalizePdfText(text || '');
  if (!safe) return 0;
  try {
    if (measureCanvas) {
      const ctx = measureCanvas.getContext('2d');
      ctx.font = getCanvasFont(size, bold);
      return ctx.measureText(safe).width;
    }
  } catch (err) {}
  return Array.from(safe).length * size * 0.50;
}
function canvasTextMask(text, size = 10, bold = false) {
  const safe = normalizePdfText(text || '-');
  const scale = 4;
  const fontSize = size * scale;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = getCanvasFont(fontSize, bold);
  const measured = Math.ceil(ctx.measureText(safe).width);
  const pad = Math.ceil(fontSize * 0.35);
  const width = Math.max(4, measured + pad * 2);
  const height = Math.max(4, Math.ceil(fontSize * 1.85));
  const baseline = Math.ceil(fontSize * 1.25);
  canvas.width = width;
  canvas.height = height;
  ctx.clearRect(0, 0, width, height);
  ctx.font = getCanvasFont(fontSize, bold);
  ctx.textBaseline = 'alphabetic';
  const rtl = isMostlyArabicText(safe);
  ctx.direction = rtl ? 'rtl' : 'ltr';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#000000';
  ctx.fillText(safe, pad, baseline);
  const img = ctx.getImageData(0, 0, width, height).data;
  const rowBytes = Math.ceil(width / 8);
  const bytes = new Uint8Array(rowBytes * height);
  for (let yy = 0; yy &lt; height; yy++) {
    for (let xx = 0; xx &lt; width; xx++) {
      const alpha = img[(yy * width + xx) * 4 + 3];
      if (alpha &gt; 48) bytes[yy * rowBytes + (xx &gt;&gt; 3)] |= (0x80 &gt;&gt; (xx &amp; 7));
    }
  }
  return { bytes, width, height, widthPt: width / scale, heightPt: height / scale, baselinePt: baseline / scale };
}

async function imageToJpegBytes(dataUrl, maxWidth = 1300, quality = 0.86) {
  const img = await new Promise((resolve, reject) =&gt; {
    const im = new Image();
    im.onload = () =&gt; resolve(im);
    im.onerror = reject;
    im.src = dataUrl;
  });
  const scale = Math.min(1, maxWidth / img.naturalWidth);
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const jpegDataUrl = canvas.toDataURL('image/jpeg', quality);
  const b64 = jpegDataUrl.split(',')[1];
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i &lt; bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return { bytes, width: canvas.width, height: canvas.height };
}

function parseBulletItems(text) {
  const raw = normalizePdfText(text || '');
  if (!raw) return [];
  const items = [];
  let current = '';
  raw.split(/\n+/).forEach(line =&gt; {
    const trimmed = String(line || '').trim();
    if (!trimmed) return;
    const bulletMatch = trimmed.match(/^(?:[-•]\s*)(.*)$/);
    if (bulletMatch) {
      if (current) items.push(current.trim());
      current = bulletMatch[1].trim();
    } else {
      current = current ? `${current} ${trimmed}` : trimmed;
    }
  });
  if (current) items.push(current.trim());
  return items.length ? items : [raw];
}
function countBulletLines(pdf, text, width, size = PDF_DATA_SIZE) {
  const items = parseBulletItems(text);
  if (!items.length) return { items: ['-'], lineCount: 1 };
  const bodyWidth = Math.max(20, width - 18);
  const lineCount = items.reduce((sum, item) =&gt; sum + pdf.wrapText(item || '-', bodyWidth, size).length, 0);
  return { items, lineCount };
}
function drawBulletText(pdf, x, y, text, maxWidth, size = PDF_DATA_SIZE, bold = PDF_DATA_BOLD, color = PDF_STYLE.ink, lineGap = 4, itemGap = 7, maxLines = 999) {
  const items = parseBulletItems(text);
  const bulletX = x;
  const textX = x + 14;
  const bodyWidth = Math.max(20, maxWidth - 14);
  let yy = y;
  let used = 0;
  const step = size + lineGap;
  (items.length ? items : ['-']).forEach((item, itemIndex) =&gt; {
    if (used &gt;= maxLines) return;
    const lines = pdf.wrapText(item || '-', bodyWidth, size);
    if (lines.length) {
      pdf.text(bulletX, yy, '-', size, bold, color);
      lines.slice(0, Math.max(0, maxLines - used)).forEach((line, idx) =&gt; {
        pdf.text(textX, yy + (idx * step), line, size, bold, color);
      });
      const drawn = Math.min(lines.length, Math.max(0, maxLines - used));
      yy += drawn * step;
      used += drawn;
    }
    if (itemIndex &lt; items.length - 1 &amp;&amp; used &lt; maxLines) yy += itemGap;
  });
  return yy;
}
function calcTextBlockHeight(pdf, text, width, size = PDF_DATA_SIZE, minH = 58, maxLines = 999) {
  const metrics = countBulletLines(pdf, text || '-', width, size);
  const itemCount = Math.max(1, metrics.items.length);
  const lineCount = Math.min(maxLines, Math.max(1, metrics.lineCount));
  const paragraphGap = Math.max(0, itemCount - 1) * 7;

      else { drawH = frameH; drawW = frameH * imgRatio; }

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) =&gt; {
    const reader = new FileReader();
    reader.onload = e =&gt; resolve(e.target.result);
    reader.onerror = () =&gt; reject(reader.error || new Error('Unable to read selected file'));
    reader.readAsDataURL(file);
  });
}
async function attachCustomSectionPhotosToPdf(pdf, data) {
  const inputs = qsa('.custom-added-section input[data-custom-added-type=&quot;attachment&quot;], .custom-added-section input[data-custom-added-type=&quot;photo&quot;]');
  for (const input of inputs) {
    const id = input.dataset.customAddedInput || '';
    const item = (data.customAddedSections || []).find(section =&gt; section.id === id);
    if (!item) continue;
    const file = input.files &amp;&amp; input.files[0];
    if (!file) { item.value = ''; continue; }
    item.value = file.name || 'Attachment selected';
    item.fileType = file.type || '';
    if (!(file.type &amp;&amp; file.type.startsWith('image/'))) continue;
    try {
      const dataUrl = await readFileAsDataUrl(file);
      const img = await imageToJpegBytes(dataUrl);
      item.pdfId = pdf.addImage(img.bytes, img.width, img.height);
      item.width = img.width;
      item.height = img.height;
    } catch (err) {
      console.warn('Could not read the selected file', err);
    }
  }
}

async function generatePdf() {
  const missing = validateRequiredFields();
  if (missing.length) {
    const list = missing.map(item =&gt; `&lt;li&gt;${escapeHtml(item)}&lt;/li&gt;`).join('');
    showModal('Missing Required Fields', `&lt;p style=&quot;font-weight:900;&quot;&gt;Please complete the following fields before generating the PDF:&lt;/p&gt;&lt;ul class=&quot;warning-list&quot;&gt;${list}&lt;/ul&gt;`);
    return;
  }
  showProgress();
  try {
    await sleep(120);
    const data = collectFormData();
    setProgress('Preparing photo attachments...', 28);
    const pdf = new SimplePdf();
    await attachCustomSectionPhotosToPdf(pdf, data);
    const imageRefs = [];
    for (let i = 0; i &lt; data.attachments.length; i++) {
      setProgress(`Processing photo ${i + 1} of ${data.attachments.length}...`, 30 + Math.round((i / Math.max(1, data.attachments.length)) * 38));
      const img = await imageToJpegBytes(data.attachments[i].dataUrl);
      const pdfId = pdf.addImage(img.bytes, img.width, img.height);
      imageRefs.push({ pdfId, width: img.width, height: img.height, caption: data.attachments[i].caption, name: data.attachments[i].name });
      await sleep(20);
    }
    setProgress('Building corporate PDF pages...', 78);
    drawReportPdf(pdf, data, imageRefs);
    pdf.finalizeFooters('Private &amp; Confidential');
    await sleep(100);
    setProgress('Saving PDF file...', 94);
    const blob = pdf.output();
    const a = document.createElement('a');
    const safeName = (data.propertyName || 'Fire_Drill_Report').replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '');
    a.href = URL.createObjectURL(blob);
    a.download = `${safeName || 'Fire_Drill_Report'}_${todayInputValue()}.pdf`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() =&gt; { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    setProgress('PDF generated successfully.', 100);
    await sleep(350);
    hideProgress();
  } catch (err) {
    console.error(err);
    hideProgress();
    showModal('PDF Generation Failed', `&lt;p style=&quot;font-weight:900;color:#e74c3c;&quot;&gt;The PDF could not be generated. Please check if any uploaded image is damaged, then try again.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;${escapeHtml(err.message || String(err))}&lt;/p&gt;`);
  }
}

  const title = cleanText($('customNewSectionTitle')?.value) || 'New Section';
  const type = ($('customNewSectionType')?.value === 'photo' ? 'attachment' : (['text','attachment','photo','date','number'].includes($('customNewSectionType')?.value) ? $('customNewSectionType').value : 'text'));
  const content = String($('customNewSectionContent')?.value || '');
  customAddedSectionsDraft.push({ id: `custom_${Date.now()}`, title, type, content });
  setValue('customNewSectionTitle', '');
  if ($('customNewSectionType')) $('customNewSectionType').value = 'text';
  setValue('customNewSectionContent', '');
  renderAddedSectionsEditor(customAddedSectionsDraft);
  setupAutoResize($('customizeModal'));
}
function removeCustomSectionDraft(id) {
  syncAddedSectionsFromEditor();
  customAddedSectionsDraft = customAddedSectionsDraft.filter(section =&gt; section.id !== id);
  renderAddedSectionsEditor(customAddedSectionsDraft);
}
function applyCoreSectionOrder(config) {
  const reportForm = $('reportForm');
  if (!reportForm) return;
  const order = getCoreSectionOrder(config);
  const cards = {};
  qsa('#reportForm &gt; section.card').forEach(card =&gt; {
    if (card.dataset.sectionKey &amp;&amp; !card.classList.contains('custom-added-section')) cards[card.dataset.sectionKey] = card;
  });
  order.forEach(key =&gt; {
    if (cards[key]) reportForm.appendChild(cards[key]);
  });
}
function applySectionManagerCustomization(config) {
  ensureCoreSectionKeys();
  applyCoreSectionOrder(config);
  const core = config?.customSections?.core || {};
  CORE_SECTION_MANAGER.forEach(item =&gt; {
    const card = document.querySelector(`[data-section-key=&quot;${CSS.escape(item.key)}&quot;]`);
    if (card) card.style.display = core[item.key]?.deleted ? 'none' : '';
  });
  renderCustomAddedSections(config?.customSections?.added || []);
}
function customSectionInputHtml(section, index) {
  const title = section.title || 'New Section';
  const type = section.type === 'photo' ? 'attachment' : (['text','attachment','photo','date','number'].includes(section.type) ? section.type : 'text');
  const id = section.id || `custom_added_${index}`;
  const content = section.content || '';
  if (type === 'attachment' || type === 'photo') {
    return `&lt;div class=&quot;custom-section-input-row&quot;&gt;&lt;input type=&quot;file&quot; accept=&quot;image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt&quot; data-custom-added-input=&quot;${escapeAttr(id)}&quot; data-custom-added-type=&quot;attachment&quot;&gt;&lt;/div&gt;`;
  }
  if (type === 'date') {
    return `&lt;div class=&quot;custom-section-input-row&quot;&gt;&lt;input type=&quot;date&quot; value=&quot;${escapeAttr(content)}&quot; data-custom-added-input=&quot;${escapeAttr(id)}&quot; data-custom-added-type=&quot;date&quot;&gt;&lt;/div&gt;`;
  }
  if (type === 'number') {
    return `&lt;div class=&quot;custom-section-input-row&quot;&gt;&lt;input type=&quot;number&quot; placeholder=&quot;${escapeAttr(content || title)}&quot; data-custom-added-input=&quot;${escapeAttr(id)}&quot; data-custom-added-type=&quot;number&quot;&gt;&lt;/div&gt;`;
  }
  return `&lt;textarea class=&quot;auto-expand&quot; data-custom-added-input=&quot;${escapeAttr(id)}&quot; data-custom-added-type=&quot;text&quot; placeholder=&quot;${escapeAttr(title)}&quot;&gt;${escapeHtml(content)}&lt;/textarea&gt;`;
}

function collectCustomAddedSectionValues() {
  return qsa('.custom-added-section').map(card =&gt; {
    const input = card.querySelector('[data-custom-added-input]');
    return {
      id: card.dataset.customAddedId || '',
      title: card.querySelector('.card-header h3')?.textContent || 'New Section',
      type: input?.dataset.customAddedType || 'text',
      value: input &amp;&amp; input.type !== 'file' ? String(input.value || '') : ''
    };
  });
}

function applyCustomAddedSectionValues(values = []) {
  if (!Array.isArray(values)) return;
  values.forEach(item =&gt; {
    const input = document.querySelector(`[data-custom-added-input=&quot;${CSS.escape(item.id || '')}&quot;]`);
    if (input &amp;&amp; input.type !== 'file') input.value = item.value || '';
  });
}

function renderCustomAddedSections(sections = []) {
  qsa('.custom-added-section').forEach(el =&gt; el.remove());
  if (!Array.isArray(sections) || !sections.length) return;
  const reportForm = $('reportForm');
  const signatureCard = document.querySelector('[data-section-key=&quot;signatures&quot;]') || document.querySelector('#signatureList')?.closest('section.card');
  sections.forEach((section, index) =&gt; {
    const card = document.createElement('section');
    card.className = 'card custom-added-section';
    card.dataset.customAddedId = section.id || `custom_added_${index}`;
    card.innerHTML = `
      &lt;div class=&quot;card-header&quot;&gt;&lt;h3&gt;${escapeHtml(section.title || 'New Section')}&lt;/h3&gt;&lt;/div&gt;
      &lt;div class=&quot;card-body&quot;&gt;
        ${customSectionInputHtml(section, index)}
      &lt;/div&gt;`;
    if (signatureCard &amp;&amp; signatureCard.parentNode === reportForm) reportForm.insertBefore(card, signatureCard);
    else reportForm.appendChild(card);
  });
}

function openCustomizeForm() {
  const config = activeFormCustomization || getCustomizationPayloadFromScript() || {};
  ensureCoreSectionKeys();
  setValue('customHtmlFileName', config.fileName || 'Customized_Fire_Drill_Report_Form.html');
  setValue('customReportSectionTitle', config.reportInfoTitle || getSectionLabelValue(CORE_SECTION_MANAGER[0], config));
  setValue('customPurposeTitle', config.sections?.purpose?.title || getCurrentLabelForField('purposeOfDrill', 'General and Purpose of fire drill exercise'));
  setValue('customPurposePlaceholder', config.sections?.purpose?.placeholder || $('purposeOfDrill')?.placeholder || 'Write the general details and purpose of the fire drill exercise');
  setValue('customPurposeDefault', config.sections?.purpose?.defaultText || valueOf('purposeOfDrill'));
  setValue('customScenarioTitle', config.sections?.scenario?.title || getCurrentLabelForField('mockScenario', 'Mock Drill Scenario'));
  setValue('customScenarioPlaceholder', config.sections?.scenario?.placeholder || $('mockScenario')?.placeholder || 'Write the mock drill scenario');
  setValue('customScenarioDefault', config.sections?.scenario?.defaultText || valueOf('mockScenario'));
  Object.entries(OPTION_GROUP_TEXTAREA_MAP).forEach(([group, id]) =&gt; setTextareaLines(id, config.optionGroups?.[group] || getOptionGroupOptions(group)));

function collectCustomizationFormData() {
  const fields = {};
  REPORT_FIELD_CONFIG.forEach(field =&gt; {
    fields[field.id] = {
      label: getCurrentLabelForField(field.id, field.defaultLabel),
      placeholder: $(field.id)?.placeholder || field.defaultPlaceholder || '',
      required: $(field.id)?.getAttribute('data-required') === 'true' || !!field.required
    };
  });
  const mainText = {};
  const customSectionsCore = {};
  CORE_SECTION_MANAGER.forEach(item =&gt; {

    if (item.type === 'reportInfo') setValue('customReportSectionTitle', label);
    else mainText[item.labelKey] = label;
  });
  const optionGroups = {};
  Object.entries(OPTION_GROUP_TEXTAREA_MAP).forEach(([group, id]) =&gt; { optionGroups[group] = getLinesFromTextarea(id, DEFAULT_OPTION_GROUPS[group]); });
  let fileName = cleanText($('customHtmlFileName')?.value) || 'Customized_Fire_Drill_Report_Form.html';
  if (!/\.html?$/i.test(fileName)) fileName += '.html';
  return {
    version: 'v40-custom-added-section-move-fixed',
    createdAt: new Date().toISOString(),
    fileName,
    reportInfoTitle: cleanText($('customReportSectionTitle')?.value) || 'Report Information',
    fields,
    sections: {
      purpose: {
        title: cleanText($('customPurposeTitle')?.value) || 'General and Purpose of fire drill exercise',
        placeholder: String($('customPurposePlaceholder')?.value || ''),
        defaultText: normalizeBulletText($('customPurposeDefault')?.value || '')
      },
      scenario: {
        title: cleanText($('customScenarioTitle')?.value) || 'Mock Drill Scenario',
        placeholder: String($('customScenarioPlaceholder')?.value || ''),
        defaultText: normalizeBulletText($('customScenarioDefault')?.value || '')
      }
    },
    mainText,
    optionGroups,
    evaluationPoints: getLinesFromTextarea('customEvaluationPoints', evaluationPoints),
    customSections: {
      core: customSectionsCore,
      order: qsa('.section-manager-row', $('customSectionManagerBody')).map(row =&gt; row.dataset.sectionManagerKey).filter(Boolean),
      added: syncAddedSectionsFromEditor()
    }
  };
}

function applyFormCustomization(config, options = {}) {
  if (!config || typeof config !== 'object') return;
  activeFormCustomization = config;
  ensureCoreSectionKeys();
  const reportHeader = document.querySelector('[data-section-key=&quot;reportInfo&quot;] .card-header h3') || document.querySelector('#reportForm .card:first-of-type .card-header h3');
  if (reportHeader &amp;&amp; config.reportInfoTitle) reportHeader.textContent = config.reportInfoTitle;
  REPORT_FIELD_CONFIG.forEach(field =&gt; {
    const custom = config.fields?.[field.id] || {};
    const required = custom.required !== undefined ? !!custom.required : field.required;
    const label = custom.label || field.defaultLabel;
    const input = $(field.id);
    setLabelForField(field.id, label, required);
    if (input) {
      if (custom.placeholder !== undefined &amp;&amp; input.type !== 'date') input.placeholder = custom.placeholder || '';
      if (required) input.setAttribute('data-required', 'true');
      else input.removeAttribute('data-required');
    }
  });
  const purpose = config.sections?.purpose || {};
  const scenario = config.sections?.scenario || {};
  setLabelForField('purposeOfDrill', purpose.title || 'General and Purpose of fire drill exercise', true);
  setLabelForField('mockScenario', scenario.title || 'Mock Drill Scenario', true);
  if ($('purposeOfDrill')) {
    $('purposeOfDrill').placeholder = purpose.placeholder || 'Write the general details and purpose of the fire drill exercise';
    if (options.setDefaults &amp;&amp; purpose.defaultText &amp;&amp; !cleanText($('purposeOfDrill').value)) $('purposeOfDrill').value = normalizeBulletText(purpose.defaultText);
  }
  if ($('mockScenario')) {
    $('mockScenario').placeholder = scenario.placeholder || 'Write the mock drill scenario';
    if (options.setDefaults &amp;&amp; scenario.defaultText &amp;&amp; !cleanText($('mockScenario').value)) $('mockScenario').value = normalizeBulletText(scenario.defaultText);
  }
  applyMainWebContentCustomization(config);
  applyOptionGroupCustomization(config);
  applyEvaluationPointCustomization(config);
  applySectionManagerCustomization(config);
  setupAutoResize();
}


/* V40: custom added sections are inserted after the last section and can move up/down in the same order list */
function getCustomAddedSectionKey(section) {
  return `custom:${section?.id || ''}`;
}

function getAddedSectionsFromConfigOrDraft(config = null) {
  if (Array.isArray(config?.customSections?.added)) return config.customSections.added;
  return Array.isArray(customAddedSectionsDraft) ? customAddedSectionsDraft : [];
}

function getFullSectionOrder(config = null) {
  const coreKeys = CORE_SECTION_MANAGER.map(item =&gt; item.key);
  const added = getAddedSectionsFromConfigOrDraft(config);
  const addedKeys = added.map(section =&gt; getCustomAddedSectionKey(section)).filter(key =&gt; key !== 'custom:');
  let saved = Array.isArray(config?.customSections?.order) ? [...config.customSections.order] : [];
  if (saved.includes('notificationWeather')) {
    saved = saved.flatMap(key =&gt; key === 'notificationWeather' ? ['notification', 'weather', 'activation', 'participants'] : key);
  }
  const allowed = [...coreKeys, ...addedKeys];
  const defaultOrder = [...coreKeys, ...addedKeys];
  const merged = [...saved.filter(key =&gt; allowed.includes(key)), ...defaultOrder.filter(key =&gt; !saved.includes(key))];
  return [...new Set(merged)];
}

function buildSectionManagerRows(config = null) {
  const body = $('customSectionManagerBody');
  if (!body) return;
  ensureCoreSectionKeys();
  body.innerHTML = '';
  const added = getAddedSectionsFromConfigOrDraft(config);
  const addedByKey = new Map(added.map(section =&gt; [getCustomAddedSectionKey(section), section]));
  const order = getFullSectionOrder(config);
  order.forEach(key =&gt; {
    const coreItem = CORE_SECTION_MANAGER.find(x =&gt; x.key === key);
    const addedSection = addedByKey.get(key);
    if (!coreItem &amp;&amp; !addedSection) return;
    const row = document.createElement('div');
    row.className = 'section-manager-row';
    row.dataset.sectionManagerKey = key;

    if (coreItem) {
      const deleted = !!config?.customSections?.core?.[coreItem.key]?.deleted;
      row.innerHTML = `
        &lt;div class=&quot;section-order-tools&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn-light btn-small&quot; title=&quot;Move up&quot; onclick=&quot;moveSectionManagerRow(this, -1)&quot;&gt;↑&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn-light btn-small&quot; title=&quot;Move down&quot; onclick=&quot;moveSectionManagerRow(this, 1)&quot;&gt;↓&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;section-static-name&quot;&gt;${escapeHtml(coreItem.name)}&lt;/div&gt;
        &lt;div&gt;
          &lt;label class=&quot;field-label&quot;&gt;Section Label&lt;/label&gt;
          &lt;input type=&quot;text&quot; data-section-label-key=&quot;${escapeAttr(coreItem.key)}&quot; value=&quot;${escapeAttr(getSectionLabelValue(coreItem, config))}&quot;&gt;
        &lt;/div&gt;
        &lt;label class=&quot;section-delete-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-section-delete-key=&quot;${escapeAttr(coreItem.key)}&quot; ${deleted ? 'checked' : ''}&gt; Delete&lt;/label&gt;`;
    } else {
      row.classList.add('custom-section-order-row');
      row.innerHTML = `
        &lt;div class=&quot;section-order-tools&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn-light btn-small&quot; title=&quot;Move up&quot; onclick=&quot;moveSectionManagerRow(this, -1)&quot;&gt;↑&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn-light btn-small&quot; title=&quot;Move down&quot; onclick=&quot;moveSectionManagerRow(this, 1)&quot;&gt;↓&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;section-static-name&quot;&gt;Custom Section&lt;br&gt;&lt;span class=&quot;muted&quot;&gt;${escapeHtml((addedSection.type || 'text').toUpperCase())}&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;
          &lt;label class=&quot;field-label&quot;&gt;Section Label&lt;/label&gt;
          &lt;input type=&quot;text&quot; data-added-order-title=&quot;${escapeAttr(addedSection.id)}&quot; value=&quot;${escapeAttr(addedSection.title || 'New Section')}&quot; oninput=&quot;syncAddedTitleFromOrderRow('${escapeAttr(addedSection.id)}', this.value)&quot;&gt;
        &lt;/div&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn-red btn-small&quot; onclick=&quot;removeCustomSectionDraft('${escapeAttr(addedSection.id)}')&quot;&gt;Delete&lt;/button&gt;`;
    }
    body.appendChild(row);
  });
}

function syncAddedTitleFromOrderRow(id, value) {
  const editInput = document.querySelector(`.custom-added-row[data-custom-section-id=&quot;${CSS.escape(id || '')}&quot;] [data-added-section-title]`);
  if (editInput &amp;&amp; editInput.value !== value) editInput.value = value;
}

function moveSectionManagerRow(button, direction) {
  const row = button.closest('.section-manager-row');
  const list = $('customSectionManagerBody');
  if (!row || !list) return;
  if (direction &lt; 0 &amp;&amp; row.previousElementSibling) list.insertBefore(row, row.previousElementSibling);
  if (direction &gt; 0 &amp;&amp; row.nextElementSibling) list.insertBefore(row.nextElementSibling, row);
}

function renderAddedSectionsEditor(sections = []) {
  const list = $('customAddedSectionsList');
  if (!list) return;
  list.innerHTML = '';
  customAddedSectionsDraft = Array.isArray(sections) ? sections.map((s, i) =&gt; ({
    id: s.id || `custom_${Date.now()}_${i}`,
    title: s.title || 'New Section',
    type: (s.type === 'photo' ? 'attachment' : (['text','attachment','photo','date','number'].includes(s.type) ? s.type : 'text')),
    content: s.content || ''
  })) : [];
  customAddedSectionsDraft.forEach(section =&gt; {
    const row = document.createElement('div');
    row.className = 'custom-added-row';
    row.dataset.customSectionId = section.id;
    row.innerHTML = `
      &lt;div&gt;&lt;label class=&quot;field-label&quot;&gt;Section Label&lt;/label&gt;&lt;input type=&quot;text&quot; data-added-section-title value=&quot;${escapeAttr(section.title)}&quot; oninput=&quot;syncAddedTitleToOrderRow('${escapeAttr(section.id)}', this.value)&quot;&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label class=&quot;field-label&quot;&gt;Type&lt;/label&gt;&lt;select data-added-section-type&gt;
        &lt;option value=&quot;text&quot; ${section.type === 'text' ? 'selected' : ''}&gt;Text&lt;/option&gt;
        &lt;option value=&quot;attachment&quot; ${(section.type === 'attachment' || section.type === 'photo') ? 'selected' : ''}&gt;Attachment&lt;/option&gt;
        &lt;option value=&quot;date&quot; ${section.type === 'date' ? 'selected' : ''}&gt;Date&lt;/option&gt;
        &lt;option value=&quot;number&quot; ${section.type === 'number' ? 'selected' : ''}&gt;Number&lt;/option&gt;
      &lt;/select&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label class=&quot;field-label&quot;&gt;Default Value / Placeholder&lt;/label&gt;&lt;textarea data-added-section-content&gt;${escapeHtml(section.content)}&lt;/textarea&gt;&lt;/div&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn-red btn-small&quot; onclick=&quot;removeCustomSectionDraft('${escapeAttr(section.id)}')&quot;&gt;Delete&lt;/button&gt;`;
    list.appendChild(row);
  });
  buildSectionManagerRows({ ...(activeFormCustomization || {}), customSections: { ...((activeFormCustomization || {}).customSections || {}), added: customAddedSectionsDraft, order: qsa('.section-manager-row', $('customSectionManagerBody')).map(row =&gt; row.dataset.sectionManagerKey).filter(Boolean) } });
}

function syncAddedTitleToOrderRow(id, value) {
  const orderInput = document.querySelector(`[data-added-order-title=&quot;${CSS.escape(id || '')}&quot;]`);
  if (orderInput &amp;&amp; orderInput.value !== value) orderInput.value = value;
}

function syncAddedSectionsFromEditor() {
  const rows = qsa('.custom-added-row', $('customAddedSectionsList'));
  customAddedSectionsDraft = rows.map((row, index) =&gt; ({
    id: row.dataset.customSectionId || `custom_${Date.now()}_${index}`,
    title: cleanText(row.querySelector('[data-added-section-title]')?.value) || cleanText(document.querySelector(`[data-added-order-title=&quot;${CSS.escape(row.dataset.customSectionId || '')}&quot;]`)?.value) || 'New Section',
    type: (row.querySelector('[data-added-section-type]')?.value === 'photo' ? 'attachment' : (['text','attachment','photo','date','number'].includes(row.querySelector('[data-added-section-type]')?.value) ? row.querySelector('[data-added-section-type]').value : 'text')),
    content: String(row.querySelector('[data-added-section-content]')?.value || '')
  }));
  return customAddedSectionsDraft;
}

function addCustomSectionFromForm() {
  syncAddedSectionsFromEditor();
  const title = cleanText($('customNewSectionTitle')?.value) || 'New Section';
  const type = ($('customNewSectionType')?.value === 'photo' ? 'attachment' : (['text','attachment','photo','date','number'].includes($('customNewSectionType')?.value) ? $('customNewSectionType').value : 'text'));
  const content = String($('customNewSectionContent')?.value || '');
  const section = { id: `custom_${Date.now()}`, title, type, content };
  customAddedSectionsDraft.push(section);
  setValue('customNewSectionTitle', '');
  if ($('customNewSectionType')) $('customNewSectionType').value = 'text';
  setValue('customNewSectionContent', '');
  renderAddedSectionsEditor(customAddedSectionsDraft);
  const newKey = getCustomAddedSectionKey(section);
  const newRow = document.querySelector(`[data-section-manager-key=&quot;${CSS.escape(newKey)}&quot;]`);
  if (newRow) {
    newRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  setupAutoResize($('customizeModal'));
}

function removeCustomSectionDraft(id) {
  syncAddedSectionsFromEditor();
  customAddedSectionsDraft = customAddedSectionsDraft.filter(section =&gt; section.id !== id);
  const orderRow = document.querySelector(`[data-section-manager-key=&quot;custom:${CSS.escape(id || '')}&quot;]`);
  if (orderRow) orderRow.remove();
  renderAddedSectionsEditor(customAddedSectionsDraft);
}

function applyFullSectionOrder(config) {
  const reportForm = $('reportForm');
  if (!reportForm) return;
  const order = getFullSectionOrder(config);
  const cards = {};
  qsa('#reportForm &gt; section.card').forEach(card =&gt; {
    if (card.classList.contains('custom-added-section')) cards[`custom:${card.dataset.customAddedId || ''}`] = card;
    else if (card.dataset.sectionKey) cards[card.dataset.sectionKey] = card;
  });
  order.forEach(key =&gt; {
    if (cards[key]) reportForm.appendChild(cards[key]);
  });
  qsa('#reportForm &gt; section.card').forEach(card =&gt; {
    const key = card.classList.contains('custom-added-section') ? `custom:${card.dataset.customAddedId || ''}` : card.dataset.sectionKey;
    if (!order.includes(key)) reportForm.appendChild(card);
  });
}

function renderCustomAddedSections(sections = []) {
  qsa('.custom-added-section').forEach(el =&gt; el.remove());
  if (!Array.isArray(sections) || !sections.length) return;
  const reportForm = $('reportForm');
  sections.forEach((section, index) =&gt; {
    const card = document.createElement('section');
    card.className = 'card custom-added-section';
    card.dataset.customAddedId = section.id || `custom_added_${index}`;
    card.innerHTML = `
      &lt;div class=&quot;card-header&quot;&gt;&lt;h3&gt;${escapeHtml(section.title || 'New Section')}&lt;/h3&gt;&lt;/div&gt;
      &lt;div class=&quot;card-body&quot;&gt;
        ${customSectionInputHtml(section, index)}
      &lt;/div&gt;`;
    reportForm.appendChild(card);
  });
}

function applySectionManagerCustomization(config) {
  ensureCoreSectionKeys();
  renderCustomAddedSections(config?.customSections?.added || []);
  applyFullSectionOrder(config);
  const core = config?.customSections?.core || {};
  CORE_SECTION_MANAGER.forEach(item =&gt; {
    const card = document.querySelector(`[data-section-key=&quot;${CSS.escape(item.key)}&quot;]`);

  });
}

function applySectionOrderToExportClone(clone, config) {
  const form = clone.querySelector('#reportForm');
  if (!form || !config) return;
  const coreKeys = (Array.isArray(CORE_SECTION_MANAGER) ? CORE_SECTION_MANAGER.map(item =&gt; item.key) : []);
  const addedSections = Array.isArray(config?.customSections?.added) ? config.customSections.added : [];
  const addedKeys = addedSections.map(section =&gt; `custom:${section?.id || ''}`).filter(key =&gt; key !== 'custom:');
  let savedOrder = Array.isArray(config?.customSections?.order) ? [...config.customSections.order] : [];
  if (savedOrder.includes('notificationWeather')) {
    savedOrder = savedOrder.flatMap(key =&gt; key === 'notificationWeather' ? ['notification', 'weather', 'activation', 'participants'] : key);
  }
  const allowed = [...coreKeys, ...addedKeys];
  const order = [...new Set([...savedOrder.filter(key =&gt; allowed.includes(key)), ...allowed.filter(key =&gt; !savedOrder.includes(key))])];
  const cards = {};
  clone.querySelectorAll('#reportForm &gt; section.card').forEach(card =&gt; {
    const key = card.classList.contains('custom-added-section') ? `custom:${card.dataset.customAddedId || ''}` : (card.dataset.sectionKey || '');
    if (key) cards[key] = card;
  });
  order.forEach(key =&gt; { if (cards[key]) form.appendChild(cards[key]); });
  const core = config?.customSections?.core || {};
  Object.keys(core).forEach(key =&gt; {
    const card = clone.querySelector(`[data-section-key=&quot;${key}&quot;]`);
    if (card) card.style.display = core[key]?.deleted ? 'none' : '';
  });
}

function prepareCleanHtmlCloneForCustomization(config) {
  const clone = document.documentElement.cloneNode(true);

  // Customized exported HTML is a final working form.
  // Do not export the تخصيص النموذج button or the customization modal.
  const customizeButton = clone.querySelector('button[onclick=&quot;openCustomizeForm()&quot;]');
  if (customizeButton) customizeButton.remove();
  const customizeModal = clone.querySelector('#customizeModal');
  if (customizeModal) customizeModal.remove();

  clone.querySelectorAll('.modal-overlay.show, .quick-feedback.show').forEach(el =&gt; el.classList.remove('show'));
  const cloneFeedback = clone.querySelector('#quickFeedback');
  if (cloneFeedback) cloneFeedback.textContent = '';
  ['observerList', 'actionList', 'signatureList', 'photosGrid'].forEach(id =&gt; {
    const el = clone.querySelector(`#${id}`);
    if (el) el.innerHTML = '';
  });
  clone.querySelectorAll('input').forEach(input =&gt; {
    if (['checkbox', 'radio'].includes(input.type)) {
      input.removeAttribute('checked');
    } else if (input.type !== 'file') {
      if (input.id === 'customHtmlFileName') input.setAttribute('value', config.fileName);
      else input.removeAttribute('value');
    }
  });
  clone.querySelectorAll('textarea').forEach(textarea =&gt; {
    textarea.textContent = '';
  });
  clone.querySelectorAll('select option').forEach(option =&gt; option.removeAttribute('selected'));
  clone.querySelectorAll('#customizeModal input, #customizeModal textarea').forEach(el =&gt; {
    if (el.type === 'checkbox') el.removeAttribute('checked');
    else el.removeAttribute('value');
    if (el.tagName === 'TEXTAREA') el.textContent = '';
  });
  applySectionOrderToExportClone(clone, config);
  const oldConfig = clone.querySelector('#spxFormCustomizationData');
  if (oldConfig) oldConfig.remove();
  const script = clone.ownerDocument.createElement('script');
  script.id = 'spxFormCustomizationData';
  script.type = 'application/json';
  script.textContent = JSON.stringify(config, null, 2).replace(/&lt;\/script/gi, '&lt;\/script');
  clone.querySelector('body').appendChild(script);
  let finalHtml = '&lt;!DOCTYPE html&gt;\n' + clone.outerHTML;
  const customKey = `spx_fire_drill_report_auto_save_${Date.now()}`;
  finalHtml = finalHtml.replace(/const AUTO_SAVE_KEY = 'spx_fire_drill_report_auto_save_v22[^']*';/, `const AUTO_SAVE_KEY = '${customKey}';`);
  return finalHtml;
}
function saveCustomizedHtmlForm() {
  const config = collectCustomizationFormData();
  const html = prepareCleanHtmlCloneForCustomization(config);
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = config.fileName;
  document.body.appendChild(a);
  a.click();
  setTimeout(() =&gt; { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  closeCustomizeForm();
  showQuickFeedback('تم حفظ نموذج HTML المخصص بنجاح');
}

  if (diff &lt; 0) diff += 24 * 60;
  const hours = Math.floor(diff / 60);
  const minutes = diff % 60;
  if (hours &amp;&amp; minutes) return `${hours} ساعة ${minutes} دقيقة`;
  if (hours) return `${hours} ساعة`;
  return `${minutes} دقيقة`;

function formatDateForDisplay(value) {

function parseFlexibleDate(value) {
  const raw = cleanText(value);
  if (!raw) return null;
  let m = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) {
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return Number.isNaN(d.getTime()) ? null : d;
  }
  m = raw.match(/^(\d{1,2})[\/\.\-\s]([A-Za-z]{3,}|\d{1,2})[\/\.\-\s](\d{4})$/);
  if (m) {
    const day = Number(m[1]);
    const monthRaw = String(m[2]).toLowerCase();
    const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const month = /^\d+$/.test(monthRaw) ? Number(monthRaw) - 1 : months.indexOf(monthRaw.slice(0,3));
    const d = new Date(Number(m[3]), month, day);
    return (month &lt; 0 || Number.isNaN(d.getTime())) ? null : d;
  }
  const fallback = new Date(raw);
  return Number.isNaN(fallback.getTime()) ? null : fallback;
}

function capitalizeLineFirstLetter(text) {
  return String(text || '').replace(/^([^A-Za-z]*)([a-z])/, (m, pre, ch) =&gt; pre + ch.toUpperCase());
}
function normalizeBulletText(value) {
  const raw = String(value || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  if (!raw.trim()) return '';
  return raw
    .split(/\n+/)
    .map(line =&gt; {
      let t = line.trimStart();
      if (!t) return '';
      t = t.replace(/^(?:[-•]\s*)/, '');
      return '- ' + capitalizeLineFirstLetter(t);
    })
    .filter(Boolean)
    .join('\n\n');
}

function normalizeBulletTextareaInPlace(el) {
  if (!el) return;
  const oldValue = el.value;
  const oldPos = el.selectionStart || 0;
  const nextValue = normalizeBulletText(oldValue);
  if (nextValue !== oldValue) {
    const delta = nextValue.length - oldValue.length;
    el.value = nextValue;
    const nextPos = Math.max(0, Math.min(nextValue.length, oldPos + delta));
    try { el.setSelectionRange(nextPos, nextPos); } catch (err) {}
  }
  autoResizeTextarea(el);
}
function setupBulletTextareaHandlers() {
  qsa('textarea.bullet-textarea').forEach(el =&gt; {
    if (el.dataset.bulletReady === 'true') return;
    el.dataset.bulletReady = 'true';
    el.addEventListener('keydown', event =&gt; {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      const start = el.selectionStart || 0;
      const end = el.selectionEnd || start;
      const insertText = (start === 0 &amp;&amp; !el.value.trim()) ? '- ' : '\n\n- ';
      el.value = el.value.slice(0, start) + insertText + el.value.slice(end);
      const nextPos = start + insertText.length;
      el.setSelectionRange(nextPos, nextPos);
      autoResizeTextarea(el);
    });
    el.addEventListener('input', () =&gt; normalizeBulletTextareaInPlace(el));
    el.addEventListener('blur', () =&gt; normalizeBulletTextareaInPlace(el));
  });
}

async function saveDraft() {
  const data = collectFormData();
  data.savedAt = new Date().toISOString();
  const jsonText = JSON.stringify(data, null, 2);
  const fileName = getDraftFileName(data);
  try {
    if ('showSaveFilePicker' in window) {
      if (!draftFileHandle) {
        draftFileHandle = await window.showSaveFilePicker({
          suggestedName: fileName,
          types: [{ description: 'مسودة تمرين الإخلاء JSON', accept: { 'application/json': ['.json'] } }]
        });
      }
      const writable = await draftFileHandle.createWritable();
      await writable.write(new Blob([jsonText], { type: 'application/json' }));
      await writable.close();
      currentDraftFileName = draftFileHandle.name || fileName;
      showQuickFeedback('تم حفظ المسودة بنجاح');
      return;
    }
  } catch (err) {
    if (err &amp;&amp; err.name === 'AbortError') return;
    console.warn('File System Access save failed, using download fallback.', err);
  }
  saveDraftByDownload(jsonText, fileName);
  showQuickFeedback('تم حفظ المسودة بنجاح');
}

async function loadDraft() {
  try {
    if ('showOpenFilePicker' in window) {
      const [handle] = await window.showOpenFilePicker({
        multiple: false,
        types: [{ description: 'مسودة تمرين الإخلاء JSON', accept: { 'application/json': ['.json'] } }]
      });
      if (!handle) return;
      const file = await handle.getFile();
      const text = await file.text();
      const data = JSON.parse(text);
      draftFileHandle = handle;
      currentDraftFileName = file.name || handle.name || '';
      applyFormData(data);
      showModal('Draft Loaded', '&lt;p style=&quot;font-weight:900;margin:0;&quot;&gt;The fire drill report draft has been loaded successfully. حفظ المسودة will update this same JSON file.&lt;/p&gt;');
      return;
    }
  } catch (err) {
    if (err &amp;&amp; err.name === 'AbortError') return;
    showModal('Invalid Draft File', '&lt;p style=&quot;font-weight:900;margin:0;color:#e74c3c;&quot;&gt;The selected file could not be loaded as a valid fire drill draft.&lt;/p&gt;');
    return;
  }
  $('loadDraftFile').click();
}

function loadDraftFromFile(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e =&gt; {
    try {
      const data = JSON.parse(e.target.result);
      draftFileHandle = null;
      currentDraftFileName = file.name || '';
      applyFormData(data);
      showModal('Draft Loaded', '&lt;p style=&quot;font-weight:900;margin:0;&quot;&gt;The fire drill report draft has been loaded successfully.&lt;/p&gt;');
    } catch (err) {
      showModal('Invalid Draft File', '&lt;p style=&quot;font-weight:900;margin:0;color:#e74c3c;&quot;&gt;The selected file could not be loaded as a valid fire drill draft.&lt;/p&gt;');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function queueAutoSave() {
  if (isApplyingData) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() =&gt; {
    try {
      localStorage.setItem(AUTO_SAVE_KEY, JSON.stringify(collectFormData()));
    } catch (err) {
      console.warn('Browser auto-save failed. The draft may be too large for local storage.', err);
    }
  }, 500);
}

function hasMeaningfulDraft(data) {
  if (!data || typeof data !== 'object') return false;
  const fields = ['propertyName', 'reportRef', 'completedBy', 'completedTitle', 'monitorLocation', 'alarmLocation', 'respondTeam', 'assemblyCondition', 'purposeOfDrill', 'mockScenario', 'assemblyCount'];
  return fields.some(key =&gt; cleanText(data[key])) ||
    (data.observers || []).some(item =&gt; cleanText(item.name) || cleanText(item.title)) ||
    (data.actions || []).some(item =&gt; cleanText(item.point) || cleanText(item.responsibility) || cleanText(item.status) || cleanText(item.targetDate) || cleanText(item.completionDate)) ||
    (data.signatures || []).some(item =&gt; cleanText(item.name) || cleanText(item.title) || cleanText(item.signature) || cleanText(item.date)) ||
    (data.attachments || []).length &gt; 0 ||
    (data.customAddedSections || []).some(item =&gt; cleanText(item.value)) ||
    (data.evaluation?.rows || []).some(row =&gt; row.mark !== null &amp;&amp; row.mark !== undefined);
}

function restoreBrowserAutoSave() {
  try {
    const raw = localStorage.getItem(AUTO_SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!hasMeaningfulDraft(data)) return false;
    applyFormData(data);
    return true;
  } catch (err) {
    console.warn('Browser auto-save restore failed.', err);
    return false;
  }
}

async function imageToJpegBytes(dataUrl, maxWidth = 1300, quality = 0.86) {
  const img = await new Promise((resolve, reject) =&gt; {
    const im = new Image();
    im.onload = () =&gt; resolve(im);
    im.onerror = reject;
    im.src = dataUrl;
  });
  const scale = Math.min(1, maxWidth / img.naturalWidth);
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const jpegDataUrl = canvas.toDataURL('image/jpeg', quality);
  const b64 = jpegDataUrl.split(',')[1];
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i &lt; bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return { bytes, width: canvas.width, height: canvas.height };
}

function parseBulletItems(text) {

    const trimmed = String(line || '').trim();
    if (!trimmed) return;
    const bulletMatch = trimmed.match(/^(?:[-•]\s*)(.*)$/);
    if (bulletMatch) {
      if (current) items.push(current.trim());
      current = bulletMatch[1].trim();
    } else {
      current = current ? `${current} ${trimmed}` : trimmed;
    }
  });
  if (current) items.push(current.trim());
  return items.length ? items : [raw];
}

  const lineCount = items.reduce((sum, item) =&gt; sum + pdf.wrapText(item || '-', bodyWidth, size).length, 0);

}

  const bulletX = x + maxWidth - 8;
  const bodyWidth = Math.max(20, maxWidth - 22);
  const textX = x + 8;
  let yy = y;
  let used = 0;
  const step = size + lineGap;
  (items.length ? items : ['-']).forEach((item, itemIndex) =&gt; {
    if (used &gt;= maxLines) return;
    const lines = pdf.wrapText(item || '-', bodyWidth, size);
    if (lines.length) {
      pdf.text(bulletX, yy, '-', size, bold, color);
      lines.slice(0, Math.max(0, maxLines - used)).forEach((line, idx) =&gt; {
        drawRightText(pdf, textX, yy + (idx * step), bodyWidth, line, size, bold, color);
      });
      const drawn = Math.min(lines.length, Math.max(0, maxLines - used));
      yy += drawn * step;
      used += drawn;

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) =&gt; {
    const reader = new FileReader();
    reader.onload = e =&gt; resolve(e.target.result);
    reader.onerror = () =&gt; reject(reader.error || new Error('تعذرت قراءة الملف المحدد'));
    reader.readAsDataURL(file);
  });
}
async function attachCustomSectionPhotosToPdf(pdf, data) {
  const inputs = qsa('.custom-added-section input[data-custom-added-type=&quot;attachment&quot;], .custom-added-section input[data-custom-added-type=&quot;photo&quot;]');
  for (const input of inputs) {
    const id = input.dataset.customAddedInput || '';
    const item = (data.customAddedSections || []).find(section =&gt; section.id === id);
    if (!item) continue;
    const file = input.files &amp;&amp; input.files[0];
    if (!file) { item.value = ''; continue; }
    item.value = file.name || 'Attachment selected';
    item.fileType = file.type || '';
    if (!(file.type &amp;&amp; file.type.startsWith('image/'))) continue;
    try {
      const dataUrl = await readFileAsDataUrl(file);
      const img = await imageToJpegBytes(dataUrl);
      item.pdfId = pdf.addImage(img.bytes, img.width, img.height);
      item.width = img.width;
      item.height = img.height;
    } catch (err) {
      console.warn('تعذرت قراءة الملف المحدد', err);
    }
  }
}

async function generatePdf() {
  const missing = validateRequiredFields();
  if (missing.length) {
    const list = missing.map(item =&gt; `&lt;li&gt;${escapeHtml(item)}&lt;/li&gt;`).join('');
    showModal('حقول مطلوبة ناقصة', `&lt;p style=&quot;font-weight:900;&quot;&gt;Please complete the following fields before generating the PDF:&lt;/p&gt;&lt;ul class=&quot;warning-list&quot;&gt;${list}&lt;/ul&gt;`);
    return;
  }
  showProgress();
  try {
    await sleep(120);
    const data = collectFormData();
    setProgress('جاري تجهيز مرفقات الصور...', 28);
    const pdf = new SimplePdf();
    await attachCustomSectionPhotosToPdf(pdf, data);
    const imageRefs = [];
    for (let i = 0; i &lt; data.attachments.length; i++) {
      setProgress(`جاري معالجة الصورة ${i + 1} من ${data.attachments.length}...`, 30 + Math.round((i / Math.max(1, data.attachments.length)) * 38));
      const img = await imageToJpegBytes(data.attachments[i].dataUrl);
      const pdfId = pdf.addImage(img.bytes, img.width, img.height);
      imageRefs.push({ pdfId, width: img.width, height: img.height, caption: data.attachments[i].caption, name: data.attachments[i].name });
      await sleep(20);
    }
    setProgress('جاري بناء صفحات PDF المؤسسية...', 78);
    drawReportPdf(pdf, data, imageRefs);
    pdf.finalizeFooters('خاص وسري');
    await sleep(100);
    setProgress('جاري حفظ ملف PDF...', 94);
    const blob = pdf.output();
    const a = document.createElement('a');
    const safeName = (data.propertyName || 'تقرير_تمرين_الإخلاء').replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '');
    a.href = URL.createObjectURL(blob);
    a.download = `${safeName || 'تقرير_تمرين_الإخلاء'}_${todayInputValue()}.pdf`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() =&gt; { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    setProgress('تم إنشاء ملف PDF بنجاح.', 100);
    await sleep(350);
    hideProgress();
  } catch (err) {
    console.error(err);
    hideProgress();
    showModal('فشل إنشاء PDF', `&lt;p style=&quot;font-weight:900;color:#e74c3c;&quot;&gt;The PDF could not be generated. Please check if any uploaded image is damaged, then try again.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;${escapeHtml(err.message || String(err))}&lt;/p&gt;`);
  }
}

    if (input) {
      if (custom.placeholder !== undefined &amp;&amp; input.type !== 'date') input.placeholder = custom.placeholder || '';

/* V40: custom added sections are inserted after the last section and can move up/down in the same order list */
function getCustomAddedSectionKey(section) {
  return `custom:${section?.id || ''}`;
}

function getAddedSectionsFromConfigOrDraft(config = null) {
  if (Array.isArray(config?.customSections?.added)) return config.customSections.added;
  return Array.isArray(customAddedSectionsDraft) ? customAddedSectionsDraft : [];
}

function getFullSectionOrder(config = null) {
  const coreKeys = CORE_SECTION_MANAGER.map(item =&gt; item.key);
  const added = getAddedSectionsFromConfigOrDraft(config);
  const addedKeys = added.map(section =&gt; getCustomAddedSectionKey(section)).filter(key =&gt; key !== 'custom:');
  let saved = Array.isArray(config?.customSections?.order) ? [...config.customSections.order] : [];
  if (saved.includes('notificationWeather')) {
    saved = saved.flatMap(key =&gt; key === 'notificationWeather' ? ['notification', 'weather', 'activation', 'participants'] : key);
  }
  const allowed = [...coreKeys, ...addedKeys];
  const defaultOrder = [...coreKeys, ...addedKeys];
  const merged = [...saved.filter(key =&gt; allowed.includes(key)), ...defaultOrder.filter(key =&gt; !saved.includes(key))];
  return [...new Set(merged)];
}

function buildSectionManagerRows(config = null) {
  const body = $('customSectionManagerBody');
  if (!body) return;
  ensureCoreSectionKeys();
  body.innerHTML = '';
  const added = getAddedSectionsFromConfigOrDraft(config);
  const addedByKey = new Map(added.map(section =&gt; [getCustomAddedSectionKey(section), section]));
  const order = getFullSectionOrder(config);
  order.forEach(key =&gt; {
    const coreItem = CORE_SECTION_MANAGER.find(x =&gt; x.key === key);
    const addedSection = addedByKey.get(key);
    if (!coreItem &amp;&amp; !addedSection) return;
    const row = document.createElement('div');
    row.className = 'section-manager-row';
    row.dataset.sectionManagerKey = key;

    if (coreItem) {
      const deleted = !!config?.customSections?.core?.[coreItem.key]?.deleted;
      row.innerHTML = `
        &lt;div class=&quot;section-order-tools&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn-light btn-small&quot; title=&quot;نقل للأعلى&quot; onclick=&quot;moveSectionManagerRow(this, -1)&quot;&gt;↑&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn-light btn-small&quot; title=&quot;نقل للأسفل&quot; onclick=&quot;moveSectionManagerRow(this, 1)&quot;&gt;↓&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;section-static-name&quot;&gt;${escapeHtml(coreItem.name)}&lt;/div&gt;
        &lt;div&gt;
          &lt;label class=&quot;field-label&quot;&gt;عنوان القسم&lt;/label&gt;
          &lt;input type=&quot;text&quot; data-section-label-key=&quot;${escapeAttr(coreItem.key)}&quot; value=&quot;${escapeAttr(getSectionLabelValue(coreItem, config))}&quot;&gt;
        &lt;/div&gt;
        &lt;label class=&quot;section-delete-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-section-delete-key=&quot;${escapeAttr(coreItem.key)}&quot; ${deleted ? 'checked' : ''}&gt; Delete&lt;/label&gt;`;
    } else {
      row.classList.add('custom-section-order-row');
      row.innerHTML = `
        &lt;div class=&quot;section-order-tools&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn-light btn-small&quot; title=&quot;نقل للأعلى&quot; onclick=&quot;moveSectionManagerRow(this, -1)&quot;&gt;↑&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn-light btn-small&quot; title=&quot;نقل للأسفل&quot; onclick=&quot;moveSectionManagerRow(this, 1)&quot;&gt;↓&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;section-static-name&quot;&gt;Custom Section&lt;br&gt;&lt;span class=&quot;muted&quot;&gt;${escapeHtml((addedSection.type || 'text').toUpperCase())}&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;
          &lt;label class=&quot;field-label&quot;&gt;عنوان القسم&lt;/label&gt;
          &lt;input type=&quot;text&quot; data-added-order-title=&quot;${escapeAttr(addedSection.id)}&quot; value=&quot;${escapeAttr(addedSection.title || 'قسم جديد')}&quot; oninput=&quot;syncAddedTitleFromOrderRow('${escapeAttr(addedSection.id)}', this.value)&quot;&gt;
        &lt;/div&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn-red btn-small&quot; onclick=&quot;removeCustomSectionDraft('${escapeAttr(addedSection.id)}')&quot;&gt;حذف&lt;/button&gt;`;
    }
    body.appendChild(row);
  });
}

function syncAddedTitleFromOrderRow(id, value) {
  const editInput = document.querySelector(`.custom-added-row[data-custom-section-id=&quot;${CSS.escape(id || '')}&quot;] [data-added-section-title]`);
  if (editInput &amp;&amp; editInput.value !== value) editInput.value = value;
}

function moveSectionManagerRow(button, direction) {
  const row = button.closest('.section-manager-row');
  const list = $('customSectionManagerBody');
  if (!row || !list) return;
  if (direction &lt; 0 &amp;&amp; row.previousElementSibling) list.insertBefore(row, row.previousElementSibling);
  if (direction &gt; 0 &amp;&amp; row.nextElementSibling) list.insertBefore(row.nextElementSibling, row);
}
